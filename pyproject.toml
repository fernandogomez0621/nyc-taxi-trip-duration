[project]
name = "nyc-taxi-trip-duration"
version = "0.1.0"
description = "Prueba tecnica - prediccion de duracion de viajes en taxi de NYC"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# El sistema de archivos de /Workspace en Databricks no soporta crear
# directorios de cache, asi que se desactiva el cacheprovider.
addopts = "-p no:cacheprovider"
